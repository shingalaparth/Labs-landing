<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ladder-title ladder-desc">
  <title id="ladder-title">Three-stage holiday delivery promise ladder</title>
  <desc id="ladder-desc">A store moves from standard delivery to express-only delivery and then to no holiday arrival guarantee as safe cutoffs pass.</desc>
  <defs>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1a1a1a" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#fffaf0"/>
  <circle cx="1540" cy="-30" r="260" fill="#fff4b8"/>
  <circle cx="40" cy="920" r="250" fill="#f3e1bd"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <line x1="76" y1="95" x2="110" y2="95" stroke="#d4aa24" stroke-width="4"/>
    <text x="128" y="103" font-size="22" font-weight="700" letter-spacing="3" fill="#6b5400">DELIVERY PROMISE LADDER</text>
    <text x="76" y="182" font-size="58" font-weight="750" letter-spacing="-1.5" fill="#1a1a1a">Change the promise as each safe cutoff passes</text>
    <text x="76" y="230" font-size="24" fill="#5b513b">One banner cannot stay accurate through the whole peak.</text>

    <g filter="url(#card-shadow)">
      <rect x="76" y="300" width="430" height="402" rx="26" fill="#ffffff" stroke="#e4d29b" stroke-width="2"/>
      <rect x="585" y="300" width="430" height="402" rx="26" fill="#ffffff" stroke="#e4d29b" stroke-width="2"/>
      <rect x="1094" y="300" width="430" height="402" rx="26" fill="#ffffff" stroke="#e4d29b" stroke-width="2"/>
    </g>

    <rect x="76" y="300" width="430" height="96" rx="26" fill="#ffe69a"/>
    <rect x="585" y="300" width="430" height="96" rx="26" fill="#f2ce5b"/>
    <rect x="1094" y="300" width="430" height="96" rx="26" fill="#1a1a1a"/>
    <text x="112" y="360" font-size="26" font-weight="800" fill="#1a1a1a">1 · STANDARD OPEN</text>
    <text x="621" y="360" font-size="26" font-weight="800" fill="#1a1a1a">2 · EXPRESS ONLY</text>
    <text x="1130" y="360" font-size="26" font-weight="800" fill="#ffffff">3 · NO GUARANTEE</text>

    <g fill="#1a1a1a">
      <text x="112" y="448" font-size="31" font-weight="750">Before standard cutoff</text>
      <text x="621" y="448" font-size="31" font-weight="750">After standard cutoff</text>
      <text x="1130" y="448" font-size="31" font-weight="750">After final safe cutoff</text>
    </g>
    <g fill="#5b513b" font-size="23">
      <text x="112" y="505">• Show standard and express</text>
      <text x="112" y="548">• Publish an honest date</text>
      <text x="112" y="591">• Keep the buffer intact</text>

      <text x="621" y="505">• Remove standard promise</text>
      <text x="621" y="548">• Verify eligible destinations</text>
      <text x="621" y="591">• Charge the real service cost</text>

      <text x="1130" y="505">• Remove arrival claim</text>
      <text x="1130" y="548">• Offer local pickup or gift card</text>
      <text x="1130" y="591">• State the later delivery date</text>
    </g>

    <path d="M518 500 H565" stroke="#d4aa24" stroke-width="8" stroke-linecap="round"/>
    <path d="M552 485 L570 500 L552 515" fill="none" stroke="#d4aa24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1027 500 H1074" stroke="#d4aa24" stroke-width="8" stroke-linecap="round"/>
    <path d="M1061 485 L1079 500 L1061 515" fill="none" stroke="#d4aa24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="390" y="770" width="820" height="58" rx="29" fill="#fff4b8" stroke="#e4d29b"/>
    <text x="800" y="807" text-anchor="middle" font-size="22" font-weight="700" fill="#5b513b">Update product page, cart, checkout, email, ads, and support together</text>
  </g>
</svg>
