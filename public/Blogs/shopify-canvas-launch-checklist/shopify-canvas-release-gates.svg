<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="gates-title gates-desc">
  <title id="gates-title">Eight Shopify Canvas release checks</title>
  <desc id="gates-desc">A two-row process checks eligibility, scope, templates, apps, mobile quality, checkout, analytics, and approval before publishing, with failed checks returning to the draft.</desc>
  <defs>
    <filter id="gate-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#181818" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#b68a00"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#fffdf6"/>
  <circle cx="1510" cy="40" r="240" fill="#ffecaa" opacity="0.78"/>
  <circle cx="10" cy="910" r="235" fill="#e1e8df" opacity="0.78"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <line x1="76" y1="92" x2="112" y2="92" stroke="#c89400" stroke-width="4"/>
    <text x="130" y="100" font-size="22" font-weight="750" letter-spacing="3" fill="#6d5600">PRE-PUBLISH DECISION FLOW</text>
    <text x="76" y="184" font-size="58" font-weight="760" letter-spacing="-1.5" fill="#181818">Eight checks before Shopify Canvas goes live</text>
    <text x="76" y="232" font-size="23" fill="#5e594d">A required failure returns the theme to the draft. Publication is the last step.</text>

    <path d="M322 410 H408 M702 410 H788 M1082 410 H1168" stroke="#b68a00" stroke-width="7" marker-end="url(#arrow)"/>
    <path d="M1380 508 V566 H220 V620" fill="none" stroke="#b68a00" stroke-width="7" marker-end="url(#arrow)"/>
    <path d="M322 700 H408 M702 700 H788 M1082 700 H1168" stroke="#b68a00" stroke-width="7" marker-end="url(#arrow)"/>

    <g filter="url(#gate-shadow)">
      <rect x="76" y="300" width="246" height="216" rx="24" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="456" y="300" width="246" height="216" rx="24" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="836" y="300" width="246" height="216" rx="24" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="1216" y="300" width="308" height="216" rx="24" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="76" y="590" width="246" height="216" rx="24" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="456" y="590" width="246" height="216" rx="24" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="836" y="590" width="246" height="216" rx="24" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="1216" y="590" width="308" height="216" rx="24" fill="#181818"/>
    </g>

    <g font-size="24" font-weight="800" fill="#181818">
      <circle cx="123" cy="347" r="24" fill="#ffcc1e"/><text x="123" y="354" text-anchor="middle">1</text>
      <circle cx="503" cy="347" r="24" fill="#ffcc1e"/><text x="503" y="354" text-anchor="middle">2</text>
      <circle cx="883" cy="347" r="24" fill="#ffcc1e"/><text x="883" y="354" text-anchor="middle">3</text>
      <circle cx="1263" cy="347" r="24" fill="#ffcc1e"/><text x="1263" y="354" text-anchor="middle">4</text>
      <circle cx="123" cy="637" r="24" fill="#ffcc1e"/><text x="123" y="644" text-anchor="middle">5</text>
      <circle cx="503" cy="637" r="24" fill="#ffcc1e"/><text x="503" y="644" text-anchor="middle">6</text>
      <circle cx="883" cy="637" r="24" fill="#ffcc1e"/><text x="883" y="644" text-anchor="middle">7</text>
      <circle cx="1263" cy="637" r="24" fill="#ffcc1e"/><text x="1263" y="644" text-anchor="middle">8</text>
    </g>

    <g fill="#181818" font-size="30" font-weight="750">
      <text x="110" y="412">Eligibility</text>
      <text x="490" y="412">Scope</text>
      <text x="870" y="412">Templates</text>
      <text x="1250" y="412">Apps + markets</text>
      <text x="110" y="702">Mobile + access</text>
      <text x="490" y="702">Purchase path</text>
      <text x="870" y="702">Analytics</text>
    </g>
    <g fill="#666052" font-size="23">
      <text x="110" y="450">Theme · plan · permission</text>
      <text x="490" y="450">One customer problem</text>
      <text x="870" y="450">Shared settings + states</text>
      <text x="1250" y="450">Dependencies survive</text>
      <text x="110" y="740">Speed · keyboard · focus</text>
      <text x="490" y="740">Product · cart · checkout</text>
      <text x="870" y="740">Events + attribution</text>
    </g>

    <text x="1370" y="706" text-anchor="middle" font-size="29" font-weight="780" fill="#ffffff">APPROVE</text>
    <text x="1370" y="746" text-anchor="middle" font-size="29" font-weight="780" fill="#ffffff">PUBLISH</text>
    <text x="1370" y="782" text-anchor="middle" font-size="22" fill="#d7d7d3">Monitor + rollback ready</text>

    <path d="M1355 836 H405" fill="none" stroke="#8b8679" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
    <text x="880" y="866" text-anchor="middle" font-size="24" font-weight="700" fill="#6d685c">Required check fails → return to the Canvas draft</text>
  </g>
</svg>
