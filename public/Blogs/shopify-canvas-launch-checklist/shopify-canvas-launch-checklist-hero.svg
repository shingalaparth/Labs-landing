<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Shopify Canvas pre-publish checklist</title>
  <desc id="hero-desc">Three storefront templates move from an AI-assisted Canvas draft through a human review gate to a controlled release.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <filter id="hero-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#181818" flood-opacity="0.11"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#hero-bg)"/>
  <circle cx="1450" cy="70" r="280" fill="#ffdf70" opacity="0.65"/>
  <circle cx="80" cy="890" r="250" fill="#dfe7df" opacity="0.72"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <line x1="76" y1="99" x2="112" y2="99" stroke="#c89400" stroke-width="4"/>
    <text x="130" y="107" font-size="22" font-weight="750" letter-spacing="3" fill="#6d5600">SHOPIFY CANVAS · EARLY ACCESS</text>
    <text x="76" y="208" font-size="70" font-weight="760" letter-spacing="-2" fill="#181818">Fast theme edits.</text>
    <text x="76" y="292" font-size="70" font-weight="760" letter-spacing="-2" fill="#6d5600">Controlled store launch.</text>
    <text x="80" y="354" font-size="26" fill="#5e594d">The preview is a draft. The release still needs proof.</text>

    <g filter="url(#hero-shadow)">
      <rect x="78" y="430" width="1120" height="332" rx="30" fill="#ffffff" stroke="#ded8c9" stroke-width="2"/>
    </g>

    <g>
      <rect x="122" y="482" width="278" height="222" rx="16" fill="#f8f6ef" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="144" y="508" width="234" height="24" rx="12" fill="#181818"/>
      <rect x="144" y="550" width="132" height="14" rx="7" fill="#b7b1a4"/>
      <rect x="144" y="580" width="214" height="70" rx="12" fill="#ffdf70"/>
      <rect x="144" y="666" width="92" height="14" rx="7" fill="#d8d2c4"/>
      <text x="261" y="736" text-anchor="middle" font-size="18" font-weight="700" fill="#5e594d">PRODUCT</text>
    </g>
    <g>
      <rect x="438" y="482" width="278" height="222" rx="16" fill="#f8f6ef" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="460" y="508" width="234" height="24" rx="12" fill="#181818"/>
      <rect x="460" y="550" width="100" height="14" rx="7" fill="#b7b1a4"/>
      <circle cx="505" cy="616" r="35" fill="#dfe7df"/>
      <circle cx="579" cy="616" r="35" fill="#eadff1"/>
      <circle cx="653" cy="616" r="35" fill="#ffdf70"/>
      <text x="577" y="736" text-anchor="middle" font-size="18" font-weight="700" fill="#5e594d">COLLECTION</text>
    </g>
    <g>
      <rect x="754" y="482" width="278" height="222" rx="16" fill="#f8f6ef" stroke="#d8d2c4" stroke-width="2"/>
      <rect x="776" y="508" width="234" height="24" rx="12" fill="#181818"/>
      <rect x="776" y="552" width="214" height="74" rx="12" fill="#dfe7df"/>
      <rect x="776" y="644" width="214" height="32" rx="16" fill="#ffcc1e"/>
      <text x="893" y="736" text-anchor="middle" font-size="18" font-weight="700" fill="#5e594d">CART</text>
    </g>

    <path d="M1058 594 H1230" fill="none" stroke="#c89400" stroke-width="10" stroke-linecap="round"/>
    <path d="M1202 570 L1234 594 L1202 618" fill="none" stroke="#c89400" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#hero-shadow)">
      <rect x="1252" y="430" width="270" height="332" rx="30" fill="#181818"/>
    </g>
    <circle cx="1387" cy="516" r="44" fill="#ffcc1e"/>
    <path d="M1366 517 L1382 533 L1411 497" fill="none" stroke="#181818" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1387" y="602" text-anchor="middle" font-size="27" font-weight="760" fill="#ffffff">HUMAN</text>
    <text x="1387" y="638" text-anchor="middle" font-size="27" font-weight="760" fill="#ffffff">RELEASE GATE</text>
    <text x="1387" y="692" text-anchor="middle" font-size="19" fill="#d7d7d3">Review · approve · publish</text>

    <rect x="570" y="810" width="460" height="52" rx="26" fill="#fff4c5" stroke="#dac36e"/>
    <text x="800" y="843" text-anchor="middle" font-size="20" font-weight="700" fill="#6d5600">Draft speed + release discipline</text>
  </g>
</svg>
